<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analista José Quipanda</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Analista José Quipanda</h1><p>Saúde e formação online</p>
<div class="card"><h2 id="tt">Entrar</h2>
<input id="nome" placeholder="Como te chamas?" style="display:none"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Senha (mín. 6)">
<button id="go">Entrar</button><button id="g" style="background:#4285f4">Continuar com Google</button>
<p><a href="#" id="tg">Não tens conta? Criar conta</a> · <a href="#" id="rs">Esqueceste a senha?</a></p>
<p><small>Ao criares conta, aceitas os <a href="termos.html">Termos e Privacidade</a>.</small></p><p id="msg"></p></div>
<script type="module">
import {auth,db,getRole,getDoc,setDoc,doc,serverTimestamp,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail} from "./app.js";
const $=i=>document.getElementById(i),m=(e,ok)=>{$("msg").style.color=ok?"#0b6b4a":"#b00020";$("msg").textContent=e.code||e.message||e};
let reg=false,busy=false;
onAuthStateChanged(auth,async u=>{if(u&&!busy){const r=await getRole(u);location.href=r==="admin"?"admin.html":"estudante.html"}});
$("tg").onclick=e=>{e.preventDefault();reg=!reg;$("nome").style.display=reg?"block":"none";$("tt").textContent=reg?"Vamos começar":"Entrar";$("go").textContent=reg?"Criar conta":"Entrar";$("tg").textContent=reg?"Já tens conta? Entrar":"Não tens conta? Criar conta"};
async function ensure(u,nome){const r=doc(db,"users",u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{email:u.email,nome:nome||u.displayName||"",role:"student",createdAt:serverTimestamp()})}
$("go").onclick=async()=>{busy=true;try{if(reg){if(!$("nome").value.trim())throw new Error("Escreve o teu nome");const c=await createUserWithEmailAndPassword(auth,$("email").value,$("pass").value);await ensure(c.user,$("nome").value.trim())}else await signInWithEmailAndPassword(auth,$("email").value,$("pass").value);location.href="estudante.html"}catch(e){busy=false;m(e)}};
$("g").onclick=async()=>{busy=true;try{const c=await signInWithPopup(auth,new GoogleAuthProvider());await ensure(c.user);location.href="estudante.html"}catch(e){busy=false;m(e)}};
$("rs").onclick=async e=>{e.preventDefault();if(!$("email").value)return m("Escreve o teu email acima");try{await sendPasswordResetEmail(auth,$("email").value);m("Enviámos um link para o teu email. Vê também o spam.",true)}catch(x){m(x)}};
</script></body></html>
